<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivet — prototype A (sleek modern)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Apply the theme before first paint (URL param > localStorage > dark).
  (function(){
    var p = new URLSearchParams(location.search).get('theme');
    var t = p || (function(){ try { return localStorage.getItem('rivet.theme'); } catch(e){ return null; } })() || 'dark';
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  })();
</script>
</head>
<body>
<div class="window" id="window">

  <header class="header" id="header">
    <div class="brand">
      <div class="app-icon" aria-hidden="true">⟳</div>
      <div>
        <div class="brand-name" id="brand-name">Rivet</div>
        <div class="brand-sub" id="brand-sub">Fedora 44 · checked 09:41</div>
      </div>
    </div>
    <div class="spacer"></div>

    <div class="search" id="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Filter updates" autocomplete="off" spellcheck="false" aria-label="Filter updates">
      <kbd>/</kbd>
    </div>

    <button class="btn icon" id="theme-btn" data-action="toggle-theme" title="Toggle dark / light" aria-label="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="btn icon" data-action="open-settings" title="Preferences" aria-label="Preferences">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="btn icon" id="menu-btn" data-action="toggle-menu" title="Menu" aria-label="Menu" aria-haspopup="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <span id="header-actions" style="display:contents"></span>
  </header>

  <div class="dropdown" id="menu" hidden role="menu">
    <button data-action="check-now">Check for updates <kbd>R</kbd></button>
    <button data-action="open-settings">Preferences <kbd>,</kbd></button>
    <div class="sep"></div>
    <div class="hint">SIMULATE</div>
    <button data-action="sim-updates">Updates available</button>
    <button data-action="sim-empty">Up to date (empty state)</button>
    <button data-action="sim-loading">Checking (loading state)</button>
    <button data-action="sim-applying">Applying updates</button>
    <button data-action="sim-done">Done · restart required</button>
    <button data-action="sim-topbar">Top-bar badge + notification</button>
    <div class="sep"></div>
    <button data-action="toggle-steam" id="steam-item">Steam: running (quit it)</button>
  </div>

  <main class="main" id="main" aria-live="polite"></main>

  <div id="overlay"></div>
</div>
<script src="app.js"></script>
</body>
</html>
