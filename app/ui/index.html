<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivet</title>
<link rel="stylesheet" href="style.css">
<!-- Looks: each file re-points style.css's custom properties under :root[data-look="…"].
     Periwinkle is style.css itself (no file). See looks/README.md. -->
<link rel="stylesheet" href="looks/nord.css">
<link rel="stylesheet" href="looks/poster.css">
<link rel="stylesheet" href="looks/workshop.css">
<link rel="stylesheet" href="looks/terminal.css">
<!-- No web fonts: Manrope and Inter ship in fonts/ (style.css @font-face), the page loads nothing
     from the network. -->
<script>
  /* The host (app/rivet_app.py) may call window.rivet.receive() before app.js has
     parsed. Queue anything that arrives early; app.js drains the queue on boot. */
  window.rivet = { _q: [], receive: function (m) { this._q.push(m); } };
  /* Theme before first paint: ?theme= wins, then the remembered setting, then system. */
  (function () {
    var p = new URLSearchParams(location.search).get('theme');
    var t = p || (function () { try { return localStorage.getItem('rivet.theme'); } catch (e) { return null; } })() || 'system';
    var dark = t === 'dark' || (t !== 'light' && !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches));
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    /* Look the same way (?look= for screenshot QA, then the remembered one); app.js owns the
       list (LOOKS) and loads the look's web fonts. Unknown ids fall back to Periwinkle. */
    var l = new URLSearchParams(location.search).get('look') || (function () { try { return localStorage.getItem('rivet.look'); } catch (e) { return null; } })();
    document.documentElement.setAttribute('data-look', /^(nord|poster|workshop|terminal)$/.test(l || '') ? l : 'periwinkle');
  })();
</script>
</head>
<body>
<div class="window" id="window">

  <header class="header" id="header">
    <div class="brand">
      <img class="app-icon" src="rivet-icon.png" alt="" aria-hidden="true">
      <div>
        <div class="brand-name" id="brand-name">Rivet</div>
        <div class="brand-sub" id="brand-sub">Starting…</div>
      </div>
    </div>
    <div class="spacer"></div>

    <div class="search" id="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Filter updates" autocomplete="off" spellcheck="false" aria-label="Filter updates">
      <kbd>/</kbd>
    </div>

    <button class="btn icon" id="theme-btn" data-action="toggle-theme" title="Toggle dark / light" aria-label="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="btn icon" data-action="open-settings" title="Preferences" aria-label="Preferences">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="btn icon" id="menu-btn" data-action="toggle-menu" title="Menu" aria-label="Menu" aria-haspopup="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <span id="header-actions" style="display:contents"></span>
  </header>

  <div class="dropdown" id="menu" hidden role="menu">
    <button data-action="check-now">Check for updates <kbd>R</kbd></button>
    <div class="sep"></div>
    <!-- the header's Security only / Safe only hide below 720 px (the window minimum is 640) -->
    <button data-action="select-security" title="Select only the updates that carry a security advisory">Security only</button>
    <button data-action="select-safe" title="Select everything except conflicts, plus any critical security fix">Safe only</button>
    <div class="sep"></div>
    <button data-action="open-settings">Preferences <kbd>,</kbd></button>
    <button data-action="next-look" title="Step through the looks (Preferences › Look shows them all)">Next look <kbd>g y</kbd></button>
    <div class="sep" id="menu-mock-sep" hidden></div>
    <div class="hint" id="menu-mock-hint" hidden>MOCK MODE</div>
    <span id="menu-mock" hidden>
      <button data-action="sim-empty">Show “up to date”</button>
      <button data-action="sim-updates">Show the update list</button>
      <button data-action="toggle-steam" id="steam-item">Toggle Steam</button>
    </span>
  </div>

  <main class="main" id="main" aria-live="polite"></main>

  <div id="overlay"></div>
</div>
<script src="app.js"></script>
</body>
</html>
